[workspace]
resolver = "2"
members = [
    "crates/wire",
    "crates/core",
    "crates/sam",
    "crates/store",
    "crates/testkit",
    "crates/runtime",
    "crates/fuzz-smoke",
    "crates/daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = { version = "2", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
async-trait = "0.1"
base64 = "0.22"
# R001-B session identity. The only OS-random primitive in the workspace; see
# crates/sam/Cargo.toml for the license and MSRV review.
getrandom = "0.3"
sha2 = "0.10"
subtle = "2.6"
nix = { version = "0.29", default-features = false, features = ["user"] }
zeroize = "1"
fs2 = "0.4"
# M003 storage boundary. `bundled` compiles a pinned SQLite so supported binary
# behavior does not depend on a host library, and `default-features = false` keeps
# the build-script/network feature set off. See architecture/dependency-review.md.
rusqlite = { version = "0.40", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
