[package]
name = "i2pr-irc-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
[dependencies]
async-trait.workspace = true
tokio.workspace = true
i2pr-irc-core = { path = "../core" }
i2pr-irc-sam = { path = "../sam" }
i2pr-irc-store = { path = "../store" }
i2pr-irc-wire = { path = "../wire" }
thiserror.workspace = true
base64.workspace = true
zeroize.workspace = true

[dev-dependencies]
i2pr-irc-testkit = { path = "../testkit" }
tokio = { workspace = true, features = ["test-util"] }
# The core-integration qualification drives the real provider against the scripted
# loopback bridge, which lives behind the same feature gate as every other test
# fixture in the crate. Re-declared here so the feature is additive for tests only:
# production builds of this crate never enable it.
i2pr-irc-sam = { path = "../sam", features = ["testkit"] }
[lints]
workspace = true
